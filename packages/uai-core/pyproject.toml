[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uai-core"
version = "0.1.0"
description = "UAI core: cross-platform runtime for the UAI collaboration framework"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["psutil>=5.9", "PyYAML>=6.0"]

[project.optional-dependencies]
nats = ["nats-py>=2.6"]
graph = ["neo4j>=5.0"]

[project.scripts]
uai = "uai_core.cli:main"

[tool.setuptools.packages.find]
include = ["uai_core*"]

[tool.setuptools.package-data]
"uai_core.detect" = ["probes.json"]
