name: conformance

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  protocol:
    name: protocol conformance + stage2 self-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install conformance deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r protocol/tests/conformance/requirements.txt
          python -m pip install nats-py pytest
          # stage2 的 hub_singleton 现在是 uai_core 的薄壳（P0 抽包）；
          # 不装这个包，test_a09_singleton 会因为 ImportError 直接判红。
          python -m pip install -e packages/uai-core

      # 两条来源合并：本仓已入库官方 proto 的未修改副本（a2a-official-spec/），
      # 这里再拿 pin 死的上游 sha256 校验它没漂移。校验不需要联网，
      # 因此既拿到「防漂移」的价值，又不引入 raw.githubusercontent 这个新失败点。
      - name: Verify in-repo official A2A proto against pinned upstream hash
        run: |
          echo "945df6e34001b2bfd0fd62d9484b63094dfad9d78705e41e2873441c419ae2d1  a2a-official-spec/a2a.proto" | sha256sum -c -

      - name: Protocol conformance (22 checks)
        working-directory: protocol/tests/conformance
        run: python run_conformance.py

      - name: Stage 2 self-tests
        working-directory: stage2
        run: |
          python test_projection.py
          python test_a2a_server.py
          python test_io.py
          python test_bridge_joins.py
          python test_unified.py
          python test_protocol_specs.py
          python test_a03_stream.py
          python test_identity.py
          python test_p1_batch.py
          python test_a09_singleton.py
          python test_b02_ao_refs.py
          python test_p2_batch.py

      - name: Panel design CSS in sync (bundle)
        # 设计只有一份源：docs/design/ui-20261118-panel/panel.css。
        # bundle 的 lib/panel-css.js 与 lib/client.js 内联区段都是生成物，
        # 不同步就判红，防止「改了 CSS 忘了 build」导致线上样式与设计不符。
        run: node packages/uai-dsh-bundle/scripts/build-css.mjs --check

      - name: Bundle client self-test
        run: node packages/uai-dsh-bundle/test/client-selftest.mjs

      - name: Core package self-tests (uai-core)
        working-directory: packages/uai-core
        run: python -m pytest tests -q 2>&1 | tee uai-core-pytest.log

      # 日志端点要仓库管理员权限，普通账号看不到 —— 所以把失败输出当工件传上来，
      # 下一次红的时候不用再猜。
      - name: Upload uai-core test log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: uai-core-pytest-log
          path: packages/uai-core/uai-core-pytest.log
          if-no-files-found: warn

      - name: Cross-repo vocabulary consistency
        working-directory: stage2
        run: python check-cross-repo-vocab.py

  bench:
    name: benchmark harness (dry run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run four-tier baseline benchmark (synthetic, no network)
        working-directory: bench
        run: |
          python run_benchmark.py --self-check
